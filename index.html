<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0b0a" />
    <meta name="description" content="Rock On! - Mobile-first band management platform" />

    <!-- Fonts (redesign): Big Shoulders Display (titles), Atkinson Hyperlegible Next (UI), Martian Mono (meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Martian+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent HTML caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>Rock On!</title>
    <script>
      // First paint in the saved theme (ThemeContext takes over after load).
      try {
        var t = localStorage.getItem('rockon.theme') || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Mobile console for debugging - only in local dev mode -->
    <script>
      // Add mobile console viewer in development only
      // Only load on localhost with dev server port (5173).
      // Skip under automation (Playwright sets navigator.webdriver) — the eruda
      // launcher floats bottom-right and intercepts clicks on the bottom-nav "More" tab.
      var isLocalDev = window.location.hostname === 'localhost' && window.location.port === '5173';
      if (isLocalDev && !navigator.webdriver) {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/eruda';
        document.body.appendChild(script);
        script.onload = function () {
          eruda.init();
          console.log('📱 Mobile console loaded - tap the icon in bottom-right corner');
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
