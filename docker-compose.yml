# Rock-On Development Stack
# ============================================================================
# Supabase is managed by the host's Supabase CLI (it runs its own Docker
# containers); this file runs the app. See docs/LOCAL_DEV.md.
#
# Usage:
#   ./start-docker.sh                           # Start everything
#
# Or manually:
#   supabase start                              # Start Supabase (host CLI)
#   docker compose up rock-on-dev               # Start the app
# ============================================================================

version: '3.8'

services:
  # ===========================================================================
  # APPLICATION SERVICE
  # ===========================================================================
  rock-on-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: rock-on-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_MOCK_AUTH=false
      # Local Supabase on the host. In dev the browser swaps this hostname for
      # the one the page was opened on (getSupabaseUrl), so the app works from
      # any machine on the LAN or a phone.
      - VITE_SUPABASE_URL=http://host.docker.internal:54321
      - VITE_SUPABASE_ANON_KEY=${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-mock}
    extra_hosts:
      # Allows container to reach host services on Windows/Mac Docker Desktop
      - "host.docker.internal:host-gateway"

  # ===========================================================================
  # PRODUCTION BUILD (optional)
  # ===========================================================================
  rock-on-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rock-on-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    profiles:
      - prod

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  node_modules:
    driver: local
